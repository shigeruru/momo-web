<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统接入 - 授权中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <!-- 只引入一次 Supabase 库 (使用 fastly 节点) -->
    <script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-image: url('bg.jpg'); background-size: cover; background-position: center; background-attachment: fixed; background-color: #050505; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        body::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%); z-index: 0; }
        .glass-box { position: relative; z-index: 10; width: 400px; max-width: 90%; padding: 50px 40px; background: rgba(20, 20, 20, 0.35); backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%); border: 1px solid rgba(255,255,255,0.15); border-radius: 28px; box-shadow: inset 1px 1px 2px rgba(255,255,255,0.4), inset -1px -1px 2px rgba(0,0,0,0.2), 0 30px 60px rgba(0,0,0,0.6); overflow: hidden; }
        .tabs { display: flex; justify-content: center; gap: 40px; margin-bottom: 30px; }
        .tabs span { color: #888; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; position: relative; padding-bottom: 5px; }
        .tabs span.active { color: #fff; }
        .tabs span.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: #fff; border-radius: 2px; box-shadow: 0 0 10px #fff; }
        .form-wrapper { position: relative; min-height: 320px; }
        .form { position: absolute; width: 100%; top: 0; left: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; visibility: hidden; transform: translateX(30px); }
        .form.active { opacity: 1; visibility: visible; transform: translateX(0); }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #888; font-size: 15px; transition: 0.3s;}
        .input-group input { width: 100%; padding: 16px 16px 16px 48px; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input::placeholder { color: #777; }
        .input-group input:focus { background: rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.4); box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .input-group input:focus + i { color: #fff; }
                /* 按钮基础样式 */
        .btn-login {
            position: relative;
            background: #fff; 
            color: #000; 
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            transition: 0.3s;
            overflow: hidden; /* 隐藏内部溢出的光晕 */
            z-index: 1;
            font-weight: 600;
        }
        
        .btn-login:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 0 30px rgba(255,255,255,0.4); 
        }

        /* 点击加载状态：禁用鼠标，字变成灰色 */
        .btn-login.loading {
            pointer-events: none;
            color: #555;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        /* 内部扫光的核心代码 */
        .btn-login.loading::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; 
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 210, 255, 0.6), transparent);
            animation: internal-sweep 1.2s infinite linear;
            z-index: -1;
        }

        /* 扫光动画：从左到右 */
        @keyframes internal-sweep {
            0% { left: -100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <div class="glass-box">
        <div class="tabs">
            <span id="tab-login" class="active" onclick="switchTab('login')">登录</span>
            <span id="tab-register" onclick="switchTab('register')">激活</span>
        </div>
        <div class="form-wrapper">
            <div id="form-login" class="form active">
                <div class="input-group"><i class="fas fa-user"></i><input type="text" id="loginUser" placeholder="授权账号"></div>
                <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="loginPass" placeholder="安全密钥"></div>
                <button class="btn btn-login" onclick="doLogin()">进入终端</button>
            </div>
            <div id="form-register" class="form">
                <div class="input-group"><i class="fas fa-id-card"></i><input type="text" id="regUser" placeholder="设置授权账号"></div>
                <div class="input-group"><i class="fas fa-ticket-alt"></i><input type="text" id="regCard" placeholder="输入卡密 (如 TEST-1234)"></div>
                <div class="input-group"><i class="fab fa-qq"></i><input type="text" id="regQQ" placeholder="绑定 QQ 账号"></div>
                <div class="input-group"><i class="fas fa-key"></i><input type="password" id="regPass" placeholder="设置安全密钥"></div>
                <button class="btn btn-login" onclick="doRegister()">激活设备</button>
            </div>
        </div>
    </div>
    <script>
        // ================= 核心初始化（变量名已改为 myDB，绝对不冲突） =================
        const SUPABASE_URL = 'https://ifrlrkjmqheivdlainur.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_4-FnUR-78EsCyJk_jyQGYA_Hk0Yr5WJ';
        const myDB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        // ==============================================================================

        function switchTab(type) {
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');
            if (type === 'login') {
                tabLogin.classList.add('active'); tabRegister.classList.remove('active');
                formLogin.classList.add('active'); formRegister.classList.remove('active');
            } else {
                tabRegister.classList.add('active'); tabLogin.classList.remove('active');
                formRegister.classList.add('active'); formLogin.classList.remove('active');
            }
        }

               async function doLogin() {
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;
            if(!username || !password) return alert("请输入账号和密码！");

            // 👇 点击后触发加载动画
            const btn = document.getElementById('loginBtn');
            const oldText = btn.innerText;
            btn.classList.add('loading');
            btn.innerText = "验证中...";

            try {
                const { data, error } = await myDB.from('cards').select('*').eq('username', username).eq('password', password).single();
                
                if (error || !data) { 
                    alert("账号或密码错误！"); 
                    return; 
                }
                localStorage.setItem("momo_user", username);
                window.location.href = 'profile.html';
            } catch (err) { 
                alert("网络请求失败！具体原因: " + err.message); 
            } finally {
                // 👇 动画结束或报错后，恢复按钮原样
                btn.classList.remove('loading');
                btn.innerText = oldText;
            }
        }

        async function doRegister() {
            const username = document.getElementById('regUser').value;
            const card = document.getElementById('regCard').value;
            const qq = document.getElementById('regQQ').value;
            const password = document.getElementById('regPass').value;
            if(!username || !card || !qq || !password) return alert("请填满所有字段！");
            try {
                const { data: cardData, error: cardErr } = await myDB.from('cards').select('*').eq('card_key', card).eq('is_used', false).single();
                if (cardErr || !cardData) { alert("卡密无效、已被使用或不存在！"); return; }
                const today = new Date().toISOString().split('T')[0];
                if (cardData.expiry_date < today) { alert("该卡密已过期！"); return; }
                const { error: updateErr } = await myDB.from('cards').update({ is_used: true, username: username, password: password, qq: qq }).eq('id', cardData.id);
                if (updateErr) { alert("激活失败，数据库写入错误！"); return; }
                alert("激活成功！请使用刚才设置的账号密码登录。");
                switchTab('login');
                document.getElementById('loginUser').value = username;
                document.getElementById('loginPass').value = password;
            } catch (err) { alert("网络请求失败！" + err.message); }
        }
    </script>
</body>
</html>
