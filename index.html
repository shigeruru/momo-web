、<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统接入 - 授权中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #050505; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        body::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%); z-index: 0; }
        
        .glass-box { position: relative; z-index: 10; width: 400px; max-width: 90%; padding: 50px 40px; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%); border: 1px solid transparent; background-clip: padding-box; box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), 0 30px 60px rgba(0, 0, 0, 0.5); border-radius: 28px; overflow: hidden; }
        
        .tabs { display: flex; justify-content: center; gap: 40px; margin-bottom: 30px; }
        .tabs span { color: #888; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; position: relative; padding-bottom: 5px; }
        .tabs span.active { color: #fff; }
        .tabs span.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: #fff; border-radius: 2px; box-shadow: 0 0 10px #fff; }
        
        .form-wrapper { position: relative; min-height: 320px; }
        .form { position: absolute; width: 100%; top: 0; left: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; visibility: hidden; transform: translateX(30px); }
        .form.active { opacity: 1; visibility: visible; transform: translateX(0); }
        
        .input-group { position: relative; margin-bottom: 20px; z-index: 1; }
        .input-group i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #666; font-size: 15px; }
        .input-group input { width: 100%; padding: 16px 16px 16px 48px; background: rgba(255, 255, 255, 0.75); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 14px; color: #000; font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input:focus { background: rgba(255, 255, 255, 0.95); border-color: rgba(0, 210, 255, 0.8); box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); }
        
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; background: #fff; color: #000; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(255,255,255,0.4); }
        .btn.loading { pointer-events: none; color: #555; }
        
        .toast { position: fixed; top: 40px; left: 50%; transform: translate(-50%, -30px); padding: 14px 32px; border-radius: 18px; background: rgba(22, 22, 26, 0.88); backdrop-filter: blur(30px); color: #fff; z-index: 99999; transition: all 0.6s; opacity: 0; pointer-events: none; text-align: center; }
        .toast.show { transform: translate(-50%, 0); opacity: 1; }
        .toast.error { border: 1px solid rgba(255, 100, 100, 0.5); color: #ffeded; }
        .toast.success { border: 1px solid rgba(100, 255, 150, 0.5); color: #edffed; }
    </style>
</head>
<body>
    <div id="toast" class="toast">提示信息</div>
    <div class="glass-box">
        <div class="tabs">
            <span id="tab-login" class="active" onclick="switchTab('login')">登录</span>
            <span id="tab-register" onclick="switchTab('register')">激活</span>
        </div>
        <div class="form-wrapper">
            <div id="form-login" class="form active">
                <div class="input-group"><i class="fas fa-user"></i><input type="text" id="loginUser" placeholder="授权账号"></div>
                <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="loginPass" placeholder="安全密钥"></div>
                <button class="btn" id="loginBtn" onclick="doLogin()">登录</button>
            </div>
            
            <div id="form-register" class="form">
                <div class="input-group"><i class="fas fa-id-card"></i><input type="text" id="regUser" placeholder="设置授权账号"></div>
                <div class="input-group"><i class="fas fa-ticket-alt"></i><input type="text" id="regCard" placeholder="输入卡密"></div>
                <div class="input-group"><i class="fab fa-qq"></i><input type="text" id="regQQ" placeholder="绑定 QQ 账号"></div>
                <div class="input-group"><i class="fas fa-key"></i><input type="password" id="regPass" placeholder="设置安全密钥"></div>
                <button class="btn" id="registerBtn" onclick="doRegister()">激活设备</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ifrlrkjmqheivdlainur.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_4-FnUR-78EsCyJk_jyQGYA_Hk0Yr5WJ';
        
        // ================= 核心：自动生成和获取设备码 =================
        function getDeviceFingerprint() {
            let fp = localStorage.getItem("device_fp");
            if (!fp) {
                // 如果没有，生成一个 12 位专属码
                fp = Array.from({length: 12}, () => "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"[Math.floor(Math.random() * 36)]).join('');
                localStorage.setItem("device_fp", fp);
            }
            return fp;
        }
        // 页面一加载就初始化设备码
        const DEVICE_FP = getDeviceFingerprint();
        // ==========================================================

        function showToast(msg, type = 'error') {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.className = 'toast show ' + type;
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        function switchTab(type) {
            const tabLogin = document.getElementById('tab-login'), tabRegister = document.getElementById('tab-register');
            const formLogin = document.getElementById('form-login'), formRegister = document.getElementById('form-register');
            if (type === 'login') {
                tabLogin.classList.add('active'); tabRegister.classList.remove('active');
                formLogin.classList.add('active'); formRegister.classList.remove('active');
            } else {
                tabRegister.classList.add('active'); tabLogin.classList.remove('active');
                formRegister.classList.add('active'); formLogin.classList.remove('active');
            }
        }

        async function doLogin() {
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;
            if(!username || !password) return showToast("请输入账号和密码！", "error");
            
            const btn = document.getElementById('loginBtn'); 
            btn.classList.add('loading'); btn.innerText = "验证中...";
            
            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/verify-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                    // 👇 登录时带上设备码
                    body: JSON.stringify({ username, password, device_fp: DEVICE_FP })
                });
                const result = await response.json();
                
                if (!result.success) { showToast(result.message || "账号或密码错误！", "error"); return; }
                
                showToast("登录成功，正在跳转...", "success");
                localStorage.setItem("momo_user", username);
                setTimeout(() => { window.location.href = 'profile.html'; }, 1000);
            } catch (err) { showToast("网络请求失败！", "error"); } finally { btn.classList.remove('loading'); btn.innerText = "登录"; }
        }

        async function doRegister() {
            const username = document.getElementById('regUser').value;
            const card = document.getElementById('regCard').value;
            const qq = document.getElementById('regQQ').value;
            const password = document.getElementById('regPass').value;
            if(!username || !card || !qq || !password) return showToast("请填满所有字段！", "error");

            const bindCode = Math.floor(10000000 + Math.random() * 90000000).toString();
            const formRegister = document.getElementById('form-register');
            const originalHTML = formRegister.innerHTML; 
            
            formRegister.innerHTML = `
                <div style="text-align: center; padding: 10px 0;">
                    <p style="color: #fff; margin-bottom: 15px; font-size: 15px;">请前往 QQ 群发送以下指令：</p>
                    <div id="copyCodeBtn" style="background: rgba(0, 210, 255, 0.15); border: 1px dashed rgba(0, 210, 255, 0.6); padding: 16px; border-radius: 12px; font-size: 22px; font-weight: bold; color: #00d2ff; letter-spacing: 2px; margin-bottom: 15px; cursor: pointer; user-select: none;" title="点击复制">
                        /bind ${bindCode}
                    </div>
                    <p style="color: #888; font-size: 12px; margin-bottom: 20px;">发送后请勿关闭此网页，系统会自动激活并绑定设备</p>
                    <div style="color: #00d2ff; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                        <i class="fas fa-spinner fa-spin"></i> 正在等待群内绑定...
                    </div>
                </div>
            `;

            document.getElementById('copyCodeBtn').onclick = () => {
                navigator.clipboard.writeText(`/bind ${bindCode}`).then(() => showToast("指令已复制", "success"));
            };

            let pollCount = 0;
            const pollTimer = setInterval(async () => {
                pollCount++;
                if (pollCount > 60) {
                    clearInterval(pollTimer);
                    formRegister.innerHTML = originalHTML;
                    document.getElementById('registerBtn').onclick = doRegister;
                    return showToast("超时未检测到绑定", "error");
                }

                try {
                    const bridgeRes = await fetch("http://127.0.0.1:8899/get_pending");
                    const pendingData = await bridgeRes.json();
                    
                    if (pendingData[bindCode]) {
                        clearInterval(pollTimer); 
                        formRegister.innerHTML = `<div style="text-align: center; color: #fff; padding: 40px 0;"><i class="fas fa-circle-notch fa-spin" style="font-size: 30px; color: #00d2ff; margin-bottom: 15px;"></i><p>正在绑定当前设备...</p></div>`;

                        const response = await fetch(`${SUPABASE_URL}/functions/v1/verify-register`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                            // 👇 注册时把设备码一起传过去
                            body: JSON.stringify({ username, card, qq, password, device_fp: DEVICE_FP })
                        });
                        const result = await response.json();

                        if (!result.success) { 
                            showToast(result.message, "error"); 
                            formRegister.innerHTML = originalHTML;
                            document.getElementById('registerBtn').onclick = doRegister;
                            return; 
                        }
                        
                        try {
                            await fetch("http://127.0.0.1:8899/clear_synced", {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ codes: [bindCode] })
                            });
                        } catch(e) {}
                        
                        showToast("激活成功！已绑定当前设备，请登录。", "success");
                        switchTab('login');
                        document.getElementById('loginUser').value = username;
                        document.getElementById('loginPass').value = password;
                        
                        formRegister.innerHTML = originalHTML;
                        document.getElementById('registerBtn').onclick = doRegister;
                    }
                } catch (err) {}
            }, 2000);
        }
    </script>
</body>
</html>
