<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统接入 - 授权中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-image: url('bg.jpg'); /* 图片路径 */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #050505;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: relative;
        }

        body::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%);
            z-index: 0;
        }

        .glass-box {
            position: relative; z-index: 10;
            width: 400px; max-width: 90%; padding: 50px 40px;
            background: rgba(20, 20, 20, 0.35);
            backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 28px;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.4), inset -1px -1px 2px rgba(0,0,0,0.2), 0 30px 60px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .tabs { display: flex; justify-content: center; gap: 40px; margin-bottom: 30px; }
        .tabs span { color: #888; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; position: relative; padding-bottom: 5px; }
        .tabs span.active { color: #fff; }
        .tabs span.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: #fff; border-radius: 2px; box-shadow: 0 0 10px #fff; }

        .form-wrapper { position: relative; min-height: 320px; }
        .form { position: absolute; width: 100%; top: 0; left: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; visibility: hidden; transform: translateX(30px); }
        .form.active { opacity: 1; visibility: visible; transform: translateX(0); }

        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #888; font-size: 15px; transition: 0.3s;}
        .input-group input { width: 100%; padding: 16px 16px 16px 48px; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input::placeholder { color: #777; }
        .input-group input:focus { background: rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.4); box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .input-group input:focus + i { color: #fff; }

        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-login { background: #fff; color: #000; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .btn-login:hover { background: #e0e0e0; transform: translateY(-2px); box-shadow: 0 0 30px rgba(255,255,255,0.4); }
    </style>
</head>
<body>

    <div class="glass-box">
        <div class="tabs">
            <span id="tab-login" class="active" onclick="switchTab('login')">登录</span>
            <span id="tab-register" onclick="switchTab('register')">激活</span>
        </div>

        <div class="form-wrapper">
            <!-- 登录表单 -->
            <div id="form-login" class="form active">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="loginUser" placeholder="授权账号">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPass" placeholder="安全密钥">
                </div>
                <button class="btn btn-login" onclick="doLogin()">进入终端</button>
            </div>

            <!-- 注册表单 -->
            <div id="form-register" class="form">
                <div class="input-group">
                    <i class="fas fa-id-card"></i>
                    <input type="text" id="regUser" placeholder="设置授权账号">
                </div>
                <div class="input-group">
                    <i class="fas fa-ticket-alt"></i>
                    <input type="text" id="regCard" placeholder="输入卡密 (如 MOMO-111)">
                </div>
                <div class="input-group">
                    <i class="fab fa-qq"></i>
                    <input type="text" id="regQQ" placeholder="绑定 QQ 账号">
                </div>
                <div class="input-group">
                    <i class="fas fa-key"></i>
                    <input type="password" id="regPass" placeholder="设置安全密钥">
                </div>
                <button class="btn btn-login" onclick="doRegister()">激活设备</button>
            </div>
        </div>
    </div>

    <script>
        // 已经内置了你的 Supabase 密钥
        const SUPABASE_URL = 'https://ifrlrkjmqheivdlainur.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_4-FnUR-78EsCyJk_jyQGYA_Hk0Yr5WJ';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function switchTab(type) {
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');

            if (type === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                formLogin.classList.add('active');
                formRegister.classList.remove('active');
            } else {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                formRegister.classList.add('active');
                formLogin.classList.remove('active');
            }
        }

        async function doLogin() {
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;
            if(!username || !password) return alert("请输入账号和密码！");

            try {
                const { data, error } = await supabase
                    .from('cards')
                    .select('*')
                    .eq('username', username)
                    .eq('password', password)
                    .single();

                if (error || !data) {
                    alert("账号或密码错误！");
                    return;
                }

                localStorage.setItem("momo_user", username);
                window.location.href = 'profile.html';
            } catch (err) {
                alert("网络请求失败，请检查控制台报错");
            }
        }

        async function doRegister() {
            const username = document.getElementById('regUser').value;
            const card = document.getElementById('regCard').value;
            const qq = document.getElementById('regQQ').value;
            const password = document.getElementById('regPass').value;
            if(!username || !card || !qq || !password) return alert("请填满所有字段！");

            try {
                const { data: cardData, error: cardErr } = await supabase
                    .from('cards')
                    .select('*')
                    .eq('card_key', card)
                    .eq('is_used', false)
                    .single();

                if (cardErr || !cardData) {
                    alert("卡密无效、已被使用或不存在！");
                    return;
                }

                const today = new Date().toISOString().split('T')[0];
                if (cardData.expiry_date < today) {
                    alert("该卡密已过期！");
                    return;
                }

                const { error: updateErr } = await supabase
                    .from('cards')
                    .update({ is_used: true, username: username, password: password, qq: qq })
                    .eq('id', cardData.id);

                if (updateErr) {
                    alert("激活失败，数据库写入错误！");
                    return;
                }

                alert("激活成功！请使用刚才设置的账号密码登录。");
                switchTab('login');
                document.getElementById('loginUser').value = username;
                document.getElementById('loginPass').value = password;

            } catch (err) {
                alert("网络请求失败，请检查控制台报错");
            }
        }
    </script>
</body>
</html>
