<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO - 个人主页</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            height: 100%; overflow: hidden; 
            font-family: 'Inter', sans-serif; 
            background-color: #000; color: #fff;
        }

        /* ================= 1. 视频背景 ================= */
        .video-container { position: fixed; inset: 0; z-index: -2; }
        
        .video-container video { 
            width: 100%; height: 100%; object-fit: cover; 
            /* 如果视频没加载出来，优先显示 bg.jpg */
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
        }
        
        /* 调淡了遮罩，让海底的蓝色更通透 */
        .video-overlay {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%);
            backdrop-filter: blur(4px) brightness(0.85); 
        }

        /* ================= 2. 开场文字 ================= */
        #intro-screen {
            position: absolute; inset: 0;
            display: flex; justify-content: flex-start; align-items: center;
            padding-left: 12vw; z-index: 10; pointer-events: none;
        }

        .intro-content {
            text-align: left;
            transform: translateY(-80px); opacity: 0;
            transition: transform 3.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.5s ease-in-out;
        }

        .intro-content.show { transform: translateY(0); opacity: 1; }
        .intro-content.hide-up {
            transform: translateY(-80px); opacity: 0;
            transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 1s ease-in-out;
        }

        .intro-small {
            font-size: 13px; letter-spacing: 8px; text-transform: uppercase;
            margin-bottom: 20px; color: rgba(255, 255, 255, 0.8); font-weight: 300;
        }

        .intro-title {
            font-family: 'Playfair Display', serif;
            font-size: 72px; line-height: 1.1; font-weight: 600;
            letter-spacing: 2px; text-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        /* ================= 3. 景深玻璃面板 ================= */
        #main-panel {
            position: absolute; inset: 0;
            display: flex; justify-content: center; align-items: center;
            padding: 20px; z-index: 5; pointer-events: none;
        }

        .profile-glass {
            width: 100%; max-width: 480px;
            position: relative;
            
            /* 极其纯净的深海蓝透明背景 */
            background: rgba(10, 30, 50, 0.2); 
            
            /* 超强毛玻璃，吃掉背景细节 */
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            
            /* 无边框感，仅顶部微光 */
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.3), 
                inset 0 0 30px rgba(255, 255, 255, 0.02);
            border-radius: 28px;
            overflow: hidden;
            
            transform: translateY(-100vh); opacity: 0;
            transition: transform 4.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.5s ease-in-out;
        }

        .profile-glass::before {
            content: ''; position: absolute; inset: -20px;
            background: radial-gradient(circle at center, rgba(0, 210, 255, 0.1) 0%, transparent 60%);
            z-index: -1; pointer-events: none; filter: blur(20px);
        }

        .profile-glass.slide-down {
            transform: translateY(0); opacity: 1; pointer-events: auto; 
        }

        /* 头部 */
        .header {
            padding: 35px 35px 25px;
            display: flex; align-items: center; gap: 20px; position: relative;
        }

        .avatar {
            width: 64px; height: 64px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; font-family: 'Playfair Display', serif; font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.1);
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .user-info { flex: 1; }
        .user-info h1 { 
            font-size: 22px; color: #fff; font-weight: 500; 
            margin-bottom: 6px; letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.2); 
        }
        
        /* 状态灯 */
        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 12px; color: rgba(255, 255, 255, 0.6); font-weight: 300;
            letter-spacing: 0.5px;
        }
        .status-dot { 
            width: 5px; height: 5px; background: #10b981; border-radius: 50%; 
            box-shadow: 0 0 10px #10b981;
            animation: pulse-green 2s infinite; 
        }
        @keyframes pulse-green { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

        /* 数据列表 */
        .data-list { padding: 0 35px 15px; position: relative; }
        
        .data-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .data-row:last-child { border-bottom: none; }

        .data-label { 
            color: rgba(255, 255, 255, 0.6); font-size: 13px; 
            display: flex; align-items: center; gap: 12px; 
            font-weight: 300; letter-spacing: 0.5px;
        }
        .data-label i { color: rgba(255, 255, 255, 0.8); font-size: 14px; width: 16px; text-align: center; }
        
        .data-value { 
            color: #fff; font-size: 14px; font-weight: 500;
            text-align: right; word-break: break-all; max-width: 65%;
            letter-spacing: 1px; font-family: 'Inter', monospace; 
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        
        /* 骨架屏 */
        .skeleton { background: rgba(255,255,255,0.1); color: transparent !important; border-radius: 4px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* 底部操作区 */
        .actions { padding: 10px 35px 35px; position: relative; }
        .btn-logout {
            width: 100%; padding: 15px; background: rgba(255, 255, 255, 0.03); color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px;
            font-size: 14px; font-weight: 400; cursor: pointer; transition: all 0.4s;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            letter-spacing: 1px;
        }
        .btn-logout:hover { 
            background: rgba(255, 255, 255, 0.1); color: #fff; border-color: rgba(255,255,255,0.3);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.1);
        }

        @media (max-width: 768px) {
            #intro-screen { justify-content: center; padding-left: 0; text-align: center; }
            .intro-content { text-align: center; }
            .intro-title { font-size: 48px; }
            .header { flex-direction: column; text-align: center; gap: 16px; }
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- 加上了 id 方便 JS 强制播放，并设置 poster 兜底 -->
        <video id="bgVideo" src="bg.mp4" poster="bg.jpg" autoplay loop muted playsinline></video>
    </div>
    <div class="video-overlay"></div>

    <!-- 开场文字 -->
    <div id="intro-screen">
        <div class="intro-content" id="intro-content">
            <div class="intro-small">Feel the world slow down</div>
            <div class="intro-title">Closer to<br>the ocean.</div>
        </div>
    </div>

    <!-- 面板 -->
    <div id="main-panel">
        <div class="profile-glass" id="profile-glass">
            <div class="header">
                <div class="avatar" id="userAvatar">...</div>
                <div class="user-info">
                    <h1 id="displayUser" class="skeleton" style="width: 100px;">加载中...</h1>
                    <div class="status-badge">
                        <div class="status-dot"></div> 授权状态正常
                    </div>
                </div>
            </div>

            <div class="data-list">
                <div class="data-row">
                    <div class="data-label"><i class="fab fa-qq"></i> 绑定 QQ</div>
                    <div class="data-value skeleton" id="displayQQ">加载中...</div>
                </div>
                <div class="data-row">
                    <div class="data-label"><i class="far fa-calendar-alt"></i> 到期时间</div>
                    <div class="data-value skeleton" id="displayExpiry">加载中...</div>
                </div>
                <div class="data-row">
                    <div class="data-label"><i class="fas fa-fingerprint"></i> 专属设备码</div>
                    <div class="data-value skeleton" id="displayDevice">加载中...</div>
                </div>
            </div>

            <div class="actions">
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt" style="opacity: 0.6;"></i> 退出当前账号
                </button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ifrlrkjmqheivdlainur.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_4-FnUR-78EsCyJk_jyQGYA_Hk0Yr5WJ';

        // 👇 强制让视频播放的逻辑 👇
        const bgVideo = document.getElementById('bgVideo');
        bgVideo.play().catch(error => {
            console.log("自动播放被拦截，尝试静音重试:", error);
            bgVideo.muted = true;
            bgVideo.play();
        });

        window.addEventListener('DOMContentLoaded', () => {
            const introContent = document.getElementById('intro-content');
            const profileGlass = document.getElementById('profile-glass');

            setTimeout(() => { introContent.classList.add('show'); }, 500);

            setTimeout(() => {
                introContent.classList.remove('show');
                introContent.classList.add('hide-up'); 
            }, 4500);

            setTimeout(() => {
                profileGlass.classList.add('slide-down');
                loadUserData(); 
            }, 6000);
        });

        async function loadUserData() {
            const username = localStorage.getItem("momo_user");
            const deviceFp = localStorage.getItem("device_fp");

            if (!username) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById("displayUser").classList.remove("skeleton");
            document.getElementById("displayUser").innerText = username;
            document.getElementById("userAvatar").innerText = username.charAt(0).toUpperCase();

            document.getElementById("displayDevice").classList.remove("skeleton");
            document.getElementById("displayDevice").innerText = deviceFp || "未绑定";

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/get-profile`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    },
                    body: JSON.stringify({ username: username })
                });
                const result = await response.json();

                document.getElementById("displayQQ").classList.remove("skeleton");
                document.getElementById("displayExpiry").classList.remove("skeleton");

                if (result.success && result.data) {
                    document.getElementById("displayQQ").innerText = result.data.qq || "未绑定QQ";
                    document.getElementById("displayExpiry").innerText = result.data.expiry_date || "长期有效";
                } else {
                    document.getElementById("displayQQ").innerText = "获取失败";
                    document.getElementById("displayExpiry").innerText = "获取失败";
                }
            } catch (error) {
                console.error("获取资料异常:", error);
                document.getElementById("displayQQ").classList.remove("skeleton");
                document.getElementById("displayExpiry").classList.remove("skeleton");
                document.getElementById("displayQQ").innerText = "网络异常";
                document.getElementById("displayExpiry").innerText = "网络异常";
            }
        }

        function logout() {
            if(confirm("确定要退出当前账号吗？")) {
                localStorage.removeItem("momo_user");
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
