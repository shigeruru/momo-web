<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 - MOMO 授权中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    
    <script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-image: url('个人.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #050505;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            padding: 20px; position: relative;
        }

        /* 背景四周暗化，中间透亮，凸显玻璃 */
        body::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.7) 100%);
            z-index: 0;
        }

        /* 👇 核心：真正的液态玻璃卡片 👇 */
        .profile-card {
            position: relative; z-index: 10;
            width: 100%; max-width: 600px;
            
            /* 极淡的透明白 */
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(28px) saturate(200%); 
            -webkit-backdrop-filter: blur(28px) saturate(200%);
            
            /* 模拟玻璃厚度的边框 */
            border: 1px solid transparent;
            background-clip: padding-box;
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.4), /* 顶部高光 */
                inset 0 -1px 1px rgba(0, 0, 0, 0.2),      /* 底部暗角 */
                0 30px 60px rgba(0, 0, 0, 0.5),           /* 深色投影 */
                0 0 0 1px rgba(255, 255, 255, 0.05);      /* 微光描边 */
                
            border-radius: 28px; overflow: hidden;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 增加一道斜向的光泽，让玻璃更通透 */
        .profile-card::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 40%);
            pointer-events: none; z-index: -1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header {
            padding: 40px 30px 30px;
            display: flex; align-items: center; gap: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .avatar {
            width: 80px; height: 80px; border-radius: 50%;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            display: flex; justify-content: center; align-items: center;
            font-size: 32px; font-weight: bold; color: #fff;
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.4), inset 0 2px 4px rgba(255,255,255,0.5);
            border: 2px solid rgba(255,255,255,0.6);
        }

        .user-info h1 { font-size: 24px; color: #fff; margin-bottom: 5px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        
        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(16, 185, 129, 0.15); color: #10b981;
            padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .status-dot { width: 6px; height: 6px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

        .data-grid { padding: 30px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }

        /* 数据块也做成磨砂玻璃 */
        .data-item {
            background: rgba(0, 0, 0, 0.25); 
            backdrop-filter: blur(10px);
            padding: 20px; border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08); transition: 0.3s;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .data-item:hover {
            background: rgba(0, 0, 0, 0.4); 
            border-color: rgba(0, 210, 255, 0.4);
            transform: translateY(-3px); 
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.1), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .data-label { font-size: 13px; color: #cbd5e1; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .data-label i { color: #00d2ff; text-shadow: 0 0 8px rgba(0,210,255,0.5); }
        .data-value { font-size: 16px; color: #fff; font-weight: 600; font-family: monospace; letter-spacing: 1px; word-break: break-all; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        
        .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.05) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 4px; color: transparent !important; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .actions { padding: 0 30px 30px; }
        .btn-logout {
            width: 100%; padding: 16px; background: rgba(255, 77, 77, 0.15); color: #ff8a8a;
            border: 1px solid rgba(255, 77, 77, 0.3); border-radius: 14px;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            backdrop-filter: blur(10px);
        }
        .btn-logout:hover { background: #ff4d4d; color: #fff; box-shadow: 0 10px 20px rgba(255, 77, 77, 0.4); }

        .toast { position: fixed; top: 40px; left: 50%; transform: translate(-50%, -30px); padding: 14px 32px; border-radius: 18px; background: rgba(22, 22, 26, 0.88); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); color: #fff; font-size: 14px; z-index: 99999; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; pointer-events: none; text-align: center; }
        .toast.show { transform: translate(-50%, 0); opacity: 1; }
        .toast.error { border-color: rgba(255, 100, 100, 0.25); color: #ffeded; }
        
        @media (max-width: 500px) { .data-grid { grid-template-columns: 1fr; } .header { flex-direction: column; text-align: center; } }
    </style>
</head>
<body>

    <div id="toast" class="toast">提示信息</div>

    <div class="profile-card">
        <div class="header">
            <div class="avatar" id="userAvatar">...</div>
            <div class="user-info">
                <h1 id="displayUser" class="skeleton" style="width: 120px;">加载中...</h1>
                <div class="status-badge">
                    <div class="status-dot"></div> 账号正常
                </div>
            </div>
        </div>

        <div class="data-grid">
            <div class="data-item">
                <div class="data-label"><i class="fab fa-qq"></i> 绑定 QQ</div>
                <div class="data-value skeleton" id="displayQQ">加载中...</div>
            </div>

            <div class="data-item">
                <div class="data-label"><i class="fas fa-clock"></i> 到期时间</div>
                <div class="data-value skeleton" id="displayExpiry" style="color: #f59e0b !important; text-shadow: 0 0 10px rgba(245,158,11,0.4);">加载中...</div>
            </div>

            <div class="data-item" style="grid-column: 1 / -1;">
                <div class="data-label"><i class="fas fa-mobile-alt"></i> 当前设备码 (Device ID)</div>
                <div class="data-value skeleton" id="displayDevice">加载中...</div>
            </div>
        </div>

        <div class="actions">
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> 退出当前账号
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ifrlrkjmqheivdlainur.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_4-FnUR-78EsCyJk_jyQGYA_Hk0Yr5WJ';

        function showToast(msg, type = 'error') {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.className = 'toast show ' + type;
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        window.onload = async () => {
            const username = localStorage.getItem("momo_user");
            const deviceFp = localStorage.getItem("device_fp");

            if (!username) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById("displayUser").classList.remove("skeleton");
            document.getElementById("displayUser").innerText = username;
            document.getElementById("userAvatar").innerText = username.charAt(0).toUpperCase();

            document.getElementById("displayDevice").classList.remove("skeleton");
            document.getElementById("displayDevice").innerText = deviceFp || "未绑定设备";

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/get-profile`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    },
                    body: JSON.stringify({ username: username })
                });
                const result = await response.json();

                document.getElementById("displayQQ").classList.remove("skeleton");
                document.getElementById("displayExpiry").classList.remove("skeleton");

                if (result.success && result.data) {
                    document.getElementById("displayQQ").innerText = result.data.qq || "未绑定QQ";
                    document.getElementById("displayExpiry").innerText = result.data.expiry_date || "长期有效";
                } else {
                    document.getElementById("displayQQ").innerText = "获取失败";
                    document.getElementById("displayExpiry").innerText = "获取失败";
                    showToast(result.message || "获取资料失败", "error");
                }
            } catch (error) {
                console.error("获取资料异常:", error);
                document.getElementById("displayQQ").classList.remove("skeleton");
                document.getElementById("displayExpiry").classList.remove("skeleton");
                document.getElementById("displayQQ").innerText = "网络异常";
                document.getElementById("displayExpiry").innerText = "网络异常";
                showToast("网络请求失败，请刷新重试", "error");
            }
        }

        function logout() {
            if(confirm("确定要退出当前账号吗？")) {
                localStorage.removeItem("momo_user");
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
