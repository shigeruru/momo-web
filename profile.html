<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO - 个人主页</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            height: 100%; width: 100%; overflow: hidden; 
            font-family: 'Inter', sans-serif; background-color: #000; color: #fff;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= 1. 视频背景 ================= */
        .video-container { position: fixed; inset: 0; z-index: 0; background: #000; }
        .video-container video { width: 100%; height: 100%; object-fit: cover; }
        
        .video-overlay {
            position: fixed; inset: 0; z-index: 1;
            background: linear-gradient(to right, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.1) 100%);
            pointer-events: none;
        }

        /* ================= 2. 开场文字 ================= */
        #intro-screen {
            position: absolute; inset: 0; display: flex; align-items: center;
            padding-left: 10vw; z-index: 10; pointer-events: none;
        }

        .intro-content {
            text-align: left; transform: translateY(-40px); opacity: 0;
            transition: transform 3.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.5s ease-in-out;
        }

        .intro-content.show { transform: translateY(0); opacity: 1; }
        .intro-content.hide-up {
            transform: translateY(-40px); opacity: 0;
            transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 1s ease-in-out;
        }

        .intro-small {
            font-size: 12px; letter-spacing: 12px; text-transform: uppercase;
            margin-bottom: 20px; color: #000; font-weight: 600;
            text-shadow: 0 0 20px rgba(255, 255, 255, 1);
        }

        .intro-title {
            font-family: 'Playfair Display', serif;
            font-size: 80px; line-height: 1.1; font-weight: 600;
            letter-spacing: 0px; color: #000; 
            text-shadow: 0 0 30px rgba(255, 255, 255, 1);
        }

        /* ================= 3. 非对称高级仪表盘 ================= */
        #main-panel {
            position: absolute; inset: 0;
            display: flex; align-items: center;
            padding-left: 10vw; z-index: 5; pointer-events: none;
        }

        .dashboard {
            width: 100%; max-width: 600px;
            transform: translateY(-100vh); opacity: 0;
            transition: transform 4.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.5s ease-in-out;
        }

        .dashboard.slide-down { transform: translateY(0); opacity: 1; pointer-events: auto; }

        /* 顶部名字区域 */
        .user-header { margin-bottom: 40px; }
        
        .greeting {
            font-size: 13px; color: rgba(255,255,255,0.6); 
            text-transform: uppercase; letter-spacing: 4px; margin-bottom: 10px;
        }

        .user-name {
            font-family: 'Playfair Display', serif;
            font-size: 64px; font-weight: 400; line-height: 1;
            color: #fff; letter-spacing: 1px;
        }

        .status-tag {
            display: inline-flex; align-items: center; gap: 8px;
            margin-top: 15px; font-size: 12px; color: rgba(255,255,255,0.7);
            letter-spacing: 1px;
        }
        .status-tag::before {
            content: ''; width: 8px; height: 8px; background: #10b981;
            border-radius: 50%; box-shadow: 0 0 10px #10b981;
        }

        /* 加载动画 (深色版) */
        .loading-box { display: flex; align-items: center; gap: 12px; margin-top: 30px; }
        .spinner {
            width: 16px; height: 16px; border: 1.5px solid rgba(255,255,255,0.1);
            border-top: 1.5px solid #fff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 12px; color: rgba(255,255,255,0.5); letter-spacing: 1px; }

        /* 数据微模块 (胶囊玻璃) */
        .data-capsules { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }
        
        .capsule {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 24px;
            width: fit-content; min-width: 320px;
            
            /* 核心：高级深色微玻璃 */
            background: rgba(15, 20, 30, 0.3);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px; /* 不那么圆，带有科技感 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: 0.3s;
        }
        .capsule:hover {
            background: rgba(25, 35, 50, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(10px);
        }

        .cap-label { 
            font-size: 12px; color: rgba(255,255,255,0.5); 
            letter-spacing: 2px; display: flex; align-items: center; gap: 10px;
        }
        .cap-label i { font-size: 14px; color: #fff; opacity: 0.8; }
        
        .cap-value { 
            font-size: 14px; color: #fff; font-weight: 400;
            font-family: monospace; letter-spacing: 1px;
        }

        /* 底部操作 */
        .actions { margin-top: 40px; }
        .btn-logout {
            padding: 14px 40px; background: transparent; color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 50px;
            font-size: 13px; font-weight: 400; cursor: pointer; transition: all 0.3s;
            letter-spacing: 2px; text-transform: uppercase;
        }
        .btn-logout:hover { 
            background: #fff; color: #000; border-color: #fff;
        }

        @media (max-width: 768px) {
            .video-overlay { background: rgba(0,0,0,0.5); } /* 手机端增强暗化 */
            #intro-screen { justify-content: center; padding-left: 0; text-align: center; }
            .intro-title { font-size: 56px; }
            #main-panel { justify-content: center; padding-left: 0; }
            .dashboard { text-align: center; display: flex; flex-direction: column; align-items: center; }
            .user-name { font-size: 48px; }
            .capsule { min-width: 300px; }
            .capsule:hover { transform: translateY(-2px); }
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="bgVideo" src="bg.mp4" poster="bg.jpg" autoplay loop muted playsinline></video>
    </div>
    <div class="video-overlay"></div>

    <div id="intro-screen">
        <div class="intro-content" id="intro-content">
            <div class="intro-small">Listen to the ocean</div>
            <div class="intro-title">Chasing<br>the light.</div>
        </div>
    </div>

    <!-- 非对称悬浮仪表盘 -->
    <div id="main-panel">
        <div class="dashboard" id="profile-glass">
            
            <div class="user-header">
                <div class="greeting">Welcome back</div>
                <div class="user-name" id="displayUser">加载中...</div>
                <div class="status-tag">System Active</div>
            </div>

            <!-- 加载圈 -->
            <div id="loadingState" class="loading-box">
                <div class="spinner"></div>
                <div class="loading-text">正在同步云端凭证...</div>
            </div>

            <!-- 微模块数据胶囊 -->
            <div class="data-capsules" id="dataList" style="display: none;">
                <div class="capsule">
                    <div class="cap-label"><i class="fab fa-qq"></i> QQ</div>
                    <div class="cap-value" id="displayQQ">-</div>
                </div>
                <div class="capsule">
                    <div class="cap-label"><i class="far fa-calendar-alt"></i> EXPIRY</div>
                    <div class="cap-value" id="displayExpiry">-</div>
                </div>
                <div class="capsule">
                    <div class="cap-label"><i class="fas fa-fingerprint"></i> DEVICE</div>
                    <div class="cap-value" id="displayDevice">-</div>
                </div>
            </div>

            <div class="actions">
                <button class="btn-logout" onclick="logout()">Log out</button>
            </div>
            
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ifrlrkjmqheivdlainur.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_4-FnUR-78EsCyJk_jyQGYA_Hk0Yr5WJ';

        const bgVideo = document.getElementById('bgVideo');
        window.addEventListener('load', () => {
            bgVideo.play().catch(err => {
                document.body.addEventListener('click', () => { bgVideo.play(); }, { once: true });
            });
        });

        window.addEventListener('DOMContentLoaded', () => {
            const introContent = document.getElementById('intro-content');
            const profileGlass = document.getElementById('profile-glass');

            setTimeout(() => { introContent.classList.add('show'); }, 500);

            setTimeout(() => {
                introContent.classList.remove('show');
                introContent.classList.add('hide-up'); 
            }, 4500);

            setTimeout(() => {
                profileGlass.classList.add('slide-down');
                loadUserData(); 
            }, 6000);
        });

        async function loadUserData() {
            const username = localStorage.getItem("momo_user");
            const deviceFp = localStorage.getItem("device_fp");
            if (!username) { window.location.href = 'index.html'; return; }

            document.getElementById("displayUser").innerText = username;
            document.getElementById("displayDevice").innerText = deviceFp || "未绑定";

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/get-profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                    body: JSON.stringify({ username: username })
                });
                const result = await response.json();

                if (result.success && result.data) {
                    document.getElementById("displayQQ").innerText = result.data.qq || "未绑定";
                    document.getElementById("displayExpiry").innerText = result.data.expiry_date || "长期有效";
                } else {
                    document.getElementById("displayQQ").innerText = "获取失败";
                    document.getElementById("displayExpiry").innerText = "获取失败";
                }
            } catch (error) {
                document.getElementById("displayQQ").innerText = "网络异常";
                document.getElementById("displayExpiry").innerText = "网络异常";
            } finally {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('dataList').style.display = 'flex';
            }
        }

        function logout() {
            if(confirm("确定要退出当前系统吗？")) {
                localStorage.removeItem("momo_user");
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
