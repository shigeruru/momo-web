<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO - Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            height: 100%; width: 100%; overflow: hidden; 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: #000; color: #fff;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= 1. Video Background ================= */
        .video-container { position: fixed; inset: 0; z-index: 0; background: #000; }
        .video-container video { width: 100%; height: 100%; object-fit: cover; }
        
        .video-overlay {
            position: fixed; inset: 0; z-index: 1;
            background: rgba(0, 0, 0, 0.15);
            pointer-events: none;
        }

        /* ================= 2. Intro Animation ================= */
        #intro-screen {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10; pointer-events: none;
        }
        .intro-content {
            text-align: center; transform: translateY(-40px); opacity: 0;
            transition: transform 3.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.5s ease-in-out;
        }
        .intro-content.show { transform: translateY(0); opacity: 1; }
        .intro-content.hide-up {
            transform: translateY(-40px); opacity: 0;
            transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 1s ease-in-out;
        }
        
        .intro-small {
            font-size: 12px; letter-spacing: 12px; text-transform: uppercase;
            margin-bottom: 20px; color: #000; font-weight: 600;
        }
        
        .intro-title {
            font-family: 'Playfair Display', serif;
            font-size: 80px; line-height: 1.1; font-weight: 600;
            color: #000; 
        }

        /* ================= 3. Centered Dashboard ================= */
        #main-panel {
            position: absolute; inset: 0;
            display: flex; justify-content: center; align-items: center;
            z-index: 5; pointer-events: none;
        }
        
        .dashboard {
            width: 90%; max-width: 340px; 
            transform: translateY(-100vh); opacity: 0;
            transition: transform 4.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.5s ease-in-out;
        }
        .dashboard.slide-down { transform: translateY(0); opacity: 1; pointer-events: auto; }

        /* ================= 4. Liquid Glass ================= */
        .liquid-glass {
            position: relative;
            padding: 24px;
            border-radius: 32px; 
            overflow: hidden;
            isolation: isolate;
            
            backdrop-filter: blur(20px) saturate(300%) contrast(120%) brightness(1.1);
            -webkit-backdrop-filter: blur(20px) saturate(300%) contrast(120%) brightness(1.1);
            
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            
            box-shadow: 
                inset 0 0 0 1px rgba(255, 255, 255, 0.3),     
                inset 0 2px 4px rgba(255, 255, 255, 0.6),     
                inset 0 -2px 6px rgba(0, 0, 0, 0.3),          
                0 20px 40px rgba(0, 0, 0, 0.4);               
        }

        .liquid-glass::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.2) 0%, transparent 50%);
            pointer-events: none;
        }

        /* ================= 5. Typography & Avatar ================= */
        .card-title {
            font-size: 12px; font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px; letter-spacing: 1.5px; text-transform: uppercase;
        }

        .user-header {
            display: flex; align-items: center; gap: 16px; margin-bottom: 24px;
        }

        /* 👇 圆形头像 (⚪) 无光晕，浅边框，带背景模糊 👇 */
        .avatar-circle {
            width: 54px; height: 54px;
            border-radius: 50%; /* 圆形 */
            
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            
            border: 1px solid rgba(255, 255, 255, 0.25); 
            
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2); 
            
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; font-weight: 500; color: #fff;
        }

        .user-identity { display: flex; flex-direction: column; gap: 4px; }
        .user-name { font-size: 18px; font-weight: 600; color: #fff; letter-spacing: 0.5px; }
        .user-role { font-size: 12px; color: rgba(255, 255, 255, 0.6); }

        /* Data List */
        .data-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
        .data-row {
            display: flex; justify-content: space-between; align-items: center; font-size: 13px;
        }
        .label { color: rgba(255, 255, 255, 0.6); font-weight: 400; }
        .value { 
            color: rgba(255, 255, 255, 0.95); font-weight: 600; 
            font-family: ui-monospace, SFMono-Regular, monospace; 
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* Button */
        .btn-logout {
            width: 100%; padding: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px; color: #fff;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.2);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Loading */
        .loading-box { display: flex; align-items: center; justify-content: center; gap: 8px; height: 80px; }
        .spinner {
            width: 14px; height: 14px; border: 1.5px solid rgba(255,255,255,0.2);
            border-top: 1.5px solid #fff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 12px; color: rgba(255,255,255,0.6); letter-spacing: 1px; text-transform: uppercase;}
    </style>
</head>
<body>

    <div class="video-container">
        <video id="bgVideo" src="bg.mp4" poster="bg.jpg" autoplay loop muted playsinline></video>
    </div>
    <div class="video-overlay"></div>

    <div id="intro-screen">
        <div class="intro-content" id="intro-content">
            <div class="intro-small">Listen to the ocean</div>
            <div class="intro-title">Chasing<br>the light.</div>
        </div>
    </div>

    <div id="main-panel">
        <div class="dashboard" id="profile-glass">
            
            <div class="liquid-glass">
                
                <div class="card-title">User Info</div>

                <div class="user-header">
                    <!-- 纯圆形头像 -->
                    <div class="avatar-circle" id="userAvatar">...</div>
                    <div class="user-identity">
                        <div class="user-name" id="displayUser">Loading...</div>
                        <div class="user-role">Authorized User</div>
                    </div>
                </div>

                <div id="loadingState" class="loading-box">
                    <div class="spinner"></div>
                    <div class="loading-text">Syncing cloud data...</div>
                </div>

                <div class="data-list" id="dataList" style="display: none;">
                    <div class="data-row">
                        <span class="label">QQ Account</span>
                        <span class="value" id="displayQQ">-</span>
                    </div>
                    <div class="data-row">
                        <span class="label">Expiry Date</span>
                        <span class="value" id="displayExpiry">-</span>
                    </div>
                    <div class="data-row">
                        <span class="label">Device ID</span>
                        <span class="value" id="displayDevice">-</span>
                    </div>
                </div>

                <button class="btn-logout" onclick="logout()">Log out</button>
            </div>
            
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ifrlrkjmqheivdlainur.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_4-FnUR-78EsCyJk_jyQGYA_Hk0Yr5WJ';

        const bgVideo = document.getElementById('bgVideo');

        // Force autoplay
        window.addEventListener('load', () => {
            bgVideo.play().catch(err => {
                document.body.addEventListener('click', () => { bgVideo.play(); }, { once: true });
            });
        });

        // Seamless loop
        bgVideo.addEventListener('timeupdate', function() {
            if (this.currentTime > this.duration - 0.2) {
                this.currentTime = 0;
                this.play();
            }
        });

        // Animation Timeline
        window.addEventListener('DOMContentLoaded', () => {
            const introContent = document.getElementById('intro-content');
            const profileGlass = document.getElementById('profile-glass');

            setTimeout(() => { introContent.classList.add('show'); }, 500);
            setTimeout(() => {
                introContent.classList.remove('show');
                introContent.classList.add('hide-up'); 
            }, 4500);
            setTimeout(() => {
                profileGlass.classList.add('slide-down');
                loadUserData(); 
            }, 6000);
        });

        async function loadUserData() {
            const username = localStorage.getItem("momo_user");
            const deviceFp = localStorage.getItem("device_fp");
            if (!username) { window.location.href = 'index.html'; return; }

            document.getElementById("displayUser").innerText = username;
            document.getElementById("userAvatar").innerText = username.charAt(0).toUpperCase();
            document.getElementById("displayDevice").innerText = deviceFp || "Not Bound";

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/get-profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                    body: JSON.stringify({ username: username })
                });
                const result = await response.json();

                if (result.success && result.data) {
                    document.getElementById("displayQQ").innerText = result.data.qq || "Not Bound";
                    document.getElementById("displayExpiry").innerText = result.data.expiry_date || "Lifetime";
                } else {
                    document.getElementById("displayQQ").innerText = "Fetch Failed";
                    document.getElementById("displayExpiry").innerText = "Fetch Failed";
                }
            } catch (error) {
                document.getElementById("displayQQ").innerText = "Network Error";
                document.getElementById("displayExpiry").innerText = "Network Error";
            } finally {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('dataList').style.display = 'flex';
            }
        }

        function logout() {
            if(confirm("Are you sure you want to log out?")) {
                localStorage.removeItem("momo_user");
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
