<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO - User Info</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            height: 100%; width: 100%; overflow: hidden; 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: #000; color: #fff;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= 1. Video Background ================= */
        .video-container { position: fixed; inset: 0; z-index: 0; background: #000; }
        .video-container video { width: 100%; height: 100%; object-fit: cover; }
        
        .video-overlay {
            position: fixed; inset: 0; z-index: 1;
            background: rgba(0, 0, 0, 0.15); /* 轻微压暗 */
            pointer-events: none;
        }

        /* ================= 2. Intro Animation ================= */
        #intro-screen {
            position: absolute; inset: 0; display: flex; 
            justify-content: flex-start; align-items: center;
            padding-left: 10vw; z-index: 10; pointer-events: none;
        }
        .intro-content {
            text-align: left; transform: translateY(-40px); opacity: 0;
            transition: transform 3.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.5s ease-in-out;
        }
        .intro-content.show { transform: translateY(0); opacity: 1; }
        .intro-content.hide-up {
            transform: translateY(-40px); opacity: 0;
            transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 1s ease-in-out;
        }
        
        .intro-small {
            font-size: 12px; letter-spacing: 12px; text-transform: uppercase;
            margin-bottom: 20px; color: #000; font-weight: 800;
        }
        .intro-title {
            font-family: 'Playfair Display', serif;
            font-size: 80px; line-height: 1.1; font-weight: 700; color: #000; 
        }

        /* ================= 3. Centered Dashboard ================= */
        #main-panel {
            position: absolute; inset: 0;
            display: flex; justify-content: center; align-items: center;
            z-index: 5; pointer-events: none;
        }
        
        .dashboard {
            width: 95%; 
            max-width: 520px; /* 👈 面板大幅放大 */
            transform: translateY(-100vh);
            opacity: 0;
            transition: transform 4.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.5s ease-in-out;
        }
        .dashboard.slide-down { transform: translateY(0); opacity: 1; pointer-events: auto; }

        /* ================= 4. 颜色跟随背景的液态玻璃 ================= */
        .liquid-glass {
            position: relative;
            padding: 45px 40px; /* 👈 内部空间更充裕 */
            border-radius: 32px; /* 更大的圆角 */
            overflow: hidden;
            isolation: isolate;
            
            /* 👈 核心：极高的饱和度 (250%) 让玻璃完全吸取背景颜色 */
            backdrop-filter: blur(10px) saturate(250%) contrast(110%);
            -webkit-backdrop-filter: blur(10px) saturate(250%) contrast(110%);
            
            /* 👈 极低透明度的底色，几乎不改变背景原有的颜色 */
            background: rgba(255, 255, 255, 0.05);
            
            /* 边缘折光 */
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 
                inset 1px 1px 2px rgba(255, 255, 255, 0.6),
                inset -1px -1px 2px rgba(0, 0, 0, 0.2),
                0 24px 50px rgba(0, 0, 0, 0.3);
        }

        /* 表面流光 */
        .liquid-glass::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 30%);
            pointer-events: none;
            z-index: -1;
        }

        /* ================= 5. Typography (全面加粗) ================= */
        .card-title {
            font-size: 20px; 
            font-weight: 800; /* 👈 极粗 */
            color: #fff;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .user-header {
            display: flex; align-items: center; gap: 22px; margin-bottom: 36px;
        }

        .avatar-circle {
            width: 76px; height: 76px; /* 头像放大 */
            border-radius: 50%; 
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.4); /* 边框加粗 */
        }

        .avatar-circle img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .user-identity { display: flex; flex-direction: column; gap: 6px; }
        .user-name { 
            font-size: 26px; /* 名字放大 */
            font-weight: 800; /* 名字极粗 */
            color: #fff; 
        }
        .user-role { 
            font-size: 16px; 
            font-weight: 600; /* 角色加粗 */
            color: rgba(255, 255, 255, 0.9); 
        }

        .data-list { display: flex; flex-direction: column; gap: 22px; margin-bottom: 36px; }
        
        .data-row {
            display: flex; justify-content: space-between; align-items: center; 
            font-size: 18px; /* 字号再次放大 */
            clip-path: inset(0 100% 0 0);
            opacity: 0;
            transition: clip-path 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1s ease-in-out;
        }
        .data-row.reveal { clip-path: inset(0 0 0 0); opacity: 1; }

        .label { 
            color: rgba(255, 255, 255, 0.95);
            font-weight: 700; /* 👈 标签加粗 */
            font-family: 'Inter', system-ui, sans-serif;
        }
        .value { 
            color: #fff; 
            font-weight: 800; /* 👈 数值极粗 */
            font-family: 'Inter', system-ui, sans-serif; 
        }

        .btn-logout {
            width: 100%; 
            padding: 20px; /* 按钮更厚 */
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-radius: 18px; 
            color: #fff;
            font-size: 18px; 
            font-weight: 800; /* 👈 按钮字体极粗 */
            cursor: pointer; transition: all 0.3s;
            letter-spacing: 2px;
        }
        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .loading-box { display: flex; align-items: center; justify-content: center; gap: 12px; height: 160px; }
        .spinner {
            width: 22px; height: 22px; border: 2.5px solid rgba(255,255,255,0.3);
            border-top: 2.5px solid #fff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 16px; font-weight: 700; color: rgba(255,255,255,0.9); letter-spacing: 1px;}

        @media (max-width: 768px) {
            #intro-screen { justify-content: center; padding-left: 0; text-align: center; }
            .intro-content { text-align: center; }
            .intro-title { font-size: 56px; }
            
            /* 手机端稍微缩小一点，防止撑爆屏幕 */
            .dashboard { max-width: 90%; }
            .liquid-glass { padding: 30px 24px; }
            .user-name { font-size: 22px; }
            .data-row { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="bgVideo" src="bg.mp4" poster="bg.jpg" autoplay loop muted playsinline></video>
    </div>
    <div class="video-overlay"></div>

    <div id="intro-screen">
        <div class="intro-content" id="intro-content">
            <div class="intro-small">Listen to the ocean</div>
            <div class="intro-title">Chasing<br>the light.</div>
        </div>
    </div>

    <div id="main-panel">
        <div class="dashboard" id="profile-glass">
            
            <div class="liquid-glass">
                
                <div class="card-title">User Info</div>

                <div class="user-header">
                    <div class="avatar-circle">
                        <img src="头像.jpg" alt="Avatar">
                    </div>
                    <div class="user-identity">
                        <div class="user-name" id="displayUser">John Doe</div>
                        <div class="user-role">Software Engineer</div>
                    </div>
                </div>

                <div id="loadingState" class="loading-box">
                    <div class="spinner"></div>
                    <div class="loading-text">Syncing...</div>
                </div>

                <div class="data-list" id="dataList" style="display: none;">
                    <div class="data-row">
                        <span class="label">QQ Account:</span>
                        <span class="value" id="displayQQ">-</span>
                    </div>
                    <div class="data-row">
                        <span class="label">Expiry Date:</span>
                        <span class="value" id="displayExpiry">-</span>
                    </div>
                    <div class="data-row">
                        <span class="label">Device ID:</span>
                        <span class="value" id="displayDevice">-</span>
                    </div>
                </div>

                <button class="btn-logout" onclick="logout()">LOG OUT</button>
            </div>
            
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ifrlrkjmqheivdlainur.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_4-FnUR-78EsCyJk_jyQGYA_Hk0Yr5WJ';

        const bgVideo = document.getElementById('bgVideo');
        window.addEventListener('load', () => {
            bgVideo.play().catch(err => {
                document.body.addEventListener('click', () => { bgVideo.play(); }, { once: true });
            });
        });
        bgVideo.addEventListener('timeupdate', function() {
            if (this.currentTime > this.duration - 0.2) { this.currentTime = 0; this.play(); }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const introContent = document.getElementById('intro-content');
            const profileGlass = document.getElementById('profile-glass');

            setTimeout(() => { introContent.classList.add('show'); }, 500);
            setTimeout(() => {
                introContent.classList.remove('show');
                introContent.classList.add('hide-up'); 
            }, 4500);
            
            setTimeout(() => {
                profileGlass.classList.add('slide-down');
                loadUserData(); 
            }, 5000); 
        });

        async function loadUserData() {
            const username = localStorage.getItem("momo_user");
            const deviceFp = localStorage.getItem("device_fp");
            if (!username) { window.location.href = 'index.html'; return; }

            document.getElementById("displayUser").innerText = username;
            document.getElementById("displayDevice").innerText = deviceFp || "Not Bound";

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/get-profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                    body: JSON.stringify({ username: username })
                });
                const result = await response.json();

                if (result.success && result.data) {
                    document.getElementById("displayQQ").innerText = result.data.qq || "Not Bound";
                    document.getElementById("displayExpiry").innerText = result.data.expiry_date || "Lifetime";
                } else {
                    document.getElementById("displayQQ").innerText = "Fetch Failed";
                    document.getElementById("displayExpiry").innerText = "Fetch Failed";
                }
            } catch (error) {
                document.getElementById("displayQQ").innerText = "Network Error";
                document.getElementById("displayExpiry").innerText = "Network Error";
            } finally {
                document.getElementById('loadingState').style.display = 'none';
                const dataList = document.getElementById('dataList');
                dataList.style.display = 'flex';
                
                const rows = dataList.querySelectorAll('.data-row');
                rows.forEach((row, index) => {
                    setTimeout(() => {
                        row.classList.add('reveal');
                    }, index * 200); 
                });
            }
        }

        function logout() {
            if(confirm("Are you sure you want to log out?")) {
                localStorage.removeItem("momo_user");
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
