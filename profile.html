<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO - User Info</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            height: 100%; width: 100%; overflow: hidden; 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: #000; color: #fff;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= 1. Video Background ================= */
        .video-container { position: fixed; inset: 0; z-index: 0; background: #000; }
        .video-container video { width: 100%; height: 100%; object-fit: cover; }
        
        .video-overlay {
            position: fixed; inset: 0; z-index: 1;
            background: radial-gradient(circle at center, rgba(0,0,0,0) 20%, rgba(0,0,0,0.35) 100%);
            pointer-events: none;
        }

        /* ================= 2. Intro Animation ================= */
        #intro-screen {
            position: absolute; inset: 0; display: flex; 
            justify-content: flex-start; align-items: center;
            padding-left: 10vw; z-index: 10; pointer-events: none;
        }
        .intro-content {
            text-align: left; transform: translateY(-40px); opacity: 0;
            transition: transform 3.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.5s ease-in-out;
        }
        .intro-content.show { transform: translateY(0); opacity: 1; }
        .intro-content.hide-up {
            transform: translateY(-40px); opacity: 0;
            transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 1s ease-in-out;
        }
        
        .intro-small {
            font-size: 12px; letter-spacing: 12px; text-transform: uppercase;
            margin-bottom: 20px; color: #000; font-weight: 600;
        }
        .intro-title {
            font-family: 'Playfair Display', serif;
            font-size: 80px; line-height: 1.1; font-weight: 600; color: #000; 
        }

        /* ================= 3. Centered Dashboard ================= */
        #main-panel {
            position: absolute; inset: 0;
            display: flex; justify-content: center; align-items: center;
            z-index: 5; pointer-events: none;
        }
        
        .dashboard {
            width: 90%; max-width: 380px; 
            transform: translateY(-100vh) translateZ(0);
            opacity: 0;
            will-change: transform, opacity;
            transition: transform 4.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.5s ease-in-out;
        }
        .dashboard.slide-down { transform: translateY(0) translateZ(0); opacity: 1; pointer-events: auto; }

        /* ================= 4. 极致厚重的液态玻璃 ================= */
        .liquid-glass {
            position: relative;
            padding: 28px 24px; 
            border-radius: 28px; 
            overflow: hidden;
            isolation: isolate;
            
            /* 极强模糊，吞噬背景细节，形成纯色块 */
            backdrop-filter: blur(50px) saturate(150%) contrast(120%);
            -webkit-backdrop-filter: blur(50px) saturate(150%) contrast(120%);
            
            /* 👈 核心改动：深邃的暗色玻璃底调，提供极高对比度 */
            background: linear-gradient(135deg, rgba(15, 25, 35, 0.65) 0%, rgba(5, 10, 15, 0.4) 100%);
            
            /* 👈 边缘厚度：不仅有一圈白边，还有内阴影的折射 */
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 
                /* 顶部极细反光 */
                inset 0 1px 2px rgba(255, 255, 255, 0.8),
                /* 整体内发光，模拟玻璃厚度 */
                inset 0 0 20px rgba(255, 255, 255, 0.1),
                /* 底部深暗角 */
                inset 0 -4px 10px rgba(0, 0, 0, 0.6),
                /* 外部悬浮阴影 */
                0 30px 60px rgba(0, 0, 0, 0.6);
        }

        /* 斜向高光切面 (Liquid 反射) */
        .liquid-glass::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 35%, rgba(255,255,255,0) 70%, rgba(255,255,255,0.05) 100%);
            pointer-events: none;
        }

        /* ================= 5. Typography & Avatar ================= */
        .card-title {
            font-size: 14px; font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 24px; letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .user-header {
            display: flex; align-items: center; gap: 16px; margin-bottom: 30px;
        }

        .avatar-circle {
            width: 54px; height: 54px; 
            border-radius: 50%; 
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            /* 头像边框也加厚，契合整体玻璃感 */
            border: 1px solid rgba(255, 255, 255, 0.5); 
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.3), 0 2px 8px rgba(0,0,0,0.4); 
        }

        .avatar-circle img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .user-identity { display: flex; flex-direction: column; gap: 4px; }
        .user-name { 
            font-size: 18px; font-weight: 600; color: #fff; 
            text-shadow: 0 1px 4px rgba(0,0,0,0.8); /* 强阴影防看不清 */
        }
        .user-role { 
            font-size: 13px; color: rgba(255, 255, 255, 0.6); 
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .data-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }
        .data-row {
            display: flex; justify-content: space-between; align-items: center; font-size: 14px; 
        }
        .label { 
            color: rgba(255, 255, 255, 0.7); font-weight: 400; 
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .value { 
            color: #fff; font-weight: 500; 
            font-family: ui-monospace, SFMono-Regular, monospace; 
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .btn-logout {
            width: 100%; padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; color: rgba(255, 255, 255, 0.9);
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Loading */
        .loading-box { display: flex; align-items: center; justify-content: center; gap: 8px; height: 120px; }
        .spinner {
            width: 14px; height: 14px; border: 1.5px solid rgba(255,255,255,0.2);
            border-top: 1.5px solid #fff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 12px; color: rgba(255,255,255,0.6); letter-spacing: 1px;}

        @media (max-width: 768px) {
            #intro-screen { justify-content: center; padding-left: 0; text-align: center; }
            .intro-content { text-align: center; }
            .intro-title { font-size: 56px; }
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="bgVideo" src="bg.mp4" poster="bg.jpg" autoplay loop muted playsinline></video>
    </div>
    <div class="video-overlay"></div>

    <div id="intro-screen">
        <div class="intro-content" id="intro-content">
            <div class="intro-small">Listen to the ocean</div>
            <div class="intro-title">Chasing<br>the light.</div>
        </div>
    </div>

    <div id="main-panel">
        <div class="dashboard" id="profile-glass">
            
            <div class="liquid-glass">
                
                <div class="card-title">User Info</div>

                <div class="user-header">
                    <div class="avatar-circle">
                        <img src="头像.jpg" alt="Avatar">
                    </div>
                    <div class="user-identity">
                        <div class="user-name" id="displayUser">Loading...</div>
                        <div class="user-role">Software Engineer</div>
                    </div>
                </div>

                <div id="loadingState" class="loading-box">
                    <div class="spinner"></div>
                    <div class="loading-text">Syncing...</div>
                </div>

                <div class="data-list" id="dataList" style="display: none;">
                    <div class="data-row">
                        <span class="label">QQ Account:</span>
                        <span class="value" id="displayQQ">-</span>
                    </div>
                    <div class="data-row">
                        <span class="label">Expiry Date:</span>
                        <span class="value" id="displayExpiry">-</span>
                    </div>
                    <div class="data-row">
                        <span class="label">Device ID:</span>
                        <span class="value" id="displayDevice">-</span>
                    </div>
                </div>

                <button class="btn-logout" onclick="logout()">LOG OUT</button>
            </div>
            
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ifrlrkjmqheivdlainur.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_4-FnUR-78EsCyJk_jyQGYA_Hk0Yr5WJ';

        const bgVideo = document.getElementById('bgVideo');
        window.addEventListener('load', () => {
            bgVideo.play().catch(err => {
                document.body.addEventListener('click', () => { bgVideo.play(); }, { once: true });
            });
        });
        bgVideo.addEventListener('timeupdate', function() {
            if (this.currentTime > this.duration - 0.2) { this.currentTime = 0; this.play(); }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const introContent = document.getElementById('intro-content');
            const profileGlass = document.getElementById('profile-glass');

            setTimeout(() => { introContent.classList.add('show'); }, 500);
            setTimeout(() => {
                introContent.classList.remove('show');
                introContent.classList.add('hide-up'); 
            }, 4500);
            
            setTimeout(() => {
                profileGlass.classList.add('slide-down');
                loadUserData(); 
            }, 5000); 
        });

        async function loadUserData() {
            const username = localStorage.getItem("momo_user");
            const deviceFp = localStorage.getItem("device_fp");
            if (!username) { window.location.href = 'index.html'; return; }

            document.getElementById("displayUser").innerText = username;
            document.getElementById("displayDevice").innerText = deviceFp || "Not Bound";

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/get-profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                    body: JSON.stringify({ username: username })
                });
                const result = await response.json();

                if (result.success && result.data) {
                    document.getElementById("displayQQ").innerText = result.data.qq || "Not Bound";
                    document.getElementById("displayExpiry").innerText = result.data.expiry_date || "Lifetime";
                } else {
                    document.getElementById("displayQQ").innerText = "Fetch Failed";
                    document.getElementById("displayExpiry").innerText = "Fetch Failed";
                }
            } catch (error) {
                document.getElementById("displayQQ").innerText = "Network Error";
                document.getElementById("displayExpiry").innerText = "Network Error";
            } finally {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('dataList').style.display = 'flex';
            }
        }

        function logout() {
            if(confirm("Are you sure you want to log out?")) {
                localStorage.removeItem("momo_user");
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
